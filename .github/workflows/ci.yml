name: secureflow-secure-delivery

on:
  pull_request:
  push:
    branches: [main]

# OIDC federation to Azure — no long-lived client secrets anywhere in this repo.
permissions:
  id-token: write
  contents: read
  security-events: write
  packages: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Set up uv
        # setup-uv stopped publishing floating major/minor tags at v8 (supply
        # chain hardening), so this is pinned exactly on purpose.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: API dependencies (uv, locked)
        run: uv sync --locked --all-packages
      - name: API tests (pytest)
        run: uv run --package secureflow-api pytest apps/api/tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secureflow_test
      - name: Migration drift check (alembic)
        run: uv run --package secureflow-api alembic -c apps/api/alembic.ini check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secureflow_test
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency scan (npm audit, high+)
        run: pnpm audit --audit-level high

  e2e-http:
    name: HTTP-mode smoke (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureflow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: API dependencies (uv, locked)
        run: uv sync --locked --all-packages
      - name: Install Playwright browsers
        run: pnpm --filter @secureflow/web exec playwright install --with-deps chromium
      - name: HTTP-mode smoke suite
        run: pnpm e2e:http

  build:
    name: Build, scan, sign artifacts
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      # upload-sarif additionally needs `actions: read` on private repos.
      id-token: write
      contents: read
      security-events: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Compute image ref (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/secureflow-api" >> "$GITHUB_ENV"
      - name: Container image build (includes SPA build stage)
        run: docker build -f docker/Dockerfile.api -t "$IMAGE:${{ github.sha }}" .
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Block only on vulnerabilities we can actually act on. The
          # python:3.13-slim (Debian 13) base currently carries 23 CRITICAL/HIGH
          # OS-package CVEs with no FixedVersion published, so an unfiltered gate
          # is permanently red with no upgrade available. The gate still fails
          # the moment a fix exists and we have not taken it.
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results (code scanning)
        if: always()
        # Code scanning needs GitHub Advanced Security on a private repo; it is
        # not enabled here, so the API 403s. Keep the step so results start
        # flowing the moment GHAS is enabled, without failing the build today.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Upload scan results (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
      - name: SBOM generation (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      # Publication needs only the built-in GITHUB_TOKEN (GHCR) and GitHub's
      # OIDC identity (Cosign keyless) — nothing here depends on Azure. Build,
      # scan, and SBOM above run on every event; push/sign only on main.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"
      - name: Sign image (Cosign, keyless OIDC)
        if: github.ref == 'refs/heads/main'
        # No floating v4 tag is published for cosign-installer; pin exactly.
        uses: sigstore/cosign-installer@v4.1.2
      - if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "$IMAGE:${{ github.sha }}"
      - name: Attach SBOM attestation
        if: github.ref == 'refs/heads/main'
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE:${{ github.sha }}"

  infrastructure:
    name: Terraform validate & plan
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Terraform format validation
        run: terraform fmt -recursive -check
        working-directory: infrastructure
      # Offline validation first: fmt, validate, and Checkov need no cloud
      # credentials, so they run on every event and are never skipped because
      # Azure is unreachable.
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate
      - name: IaC policy scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          hard_fail_on: HIGH
      # Planning needs the real remote state, so it depends on Azure OIDC and
      # skips when AZURE_CLIENT_ID is unset.
      - name: Azure login (OIDC)
        if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init (remote backend)
        if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        run: terraform init -reconfigure -input=false
      - name: Terraform plan
        if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        run: terraform plan -input=false -out=tfplan
      - name: Upload plan artifact
        if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan

  deploy-dev:
    name: Deploy to development
    # Skips entirely until Azure OIDC variables are configured; deploy-production
    # depends on this job, so it skips with it.
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    needs: [build, infrastructure]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - name: Compute image ref (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/secureflow-api" >> "$GITHUB_ENV"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App image
        run: |
          az containerapp update \
            --name ca-secureflow-dev-api \
            --resource-group rg-secureflow-dev \
            --image "$IMAGE:${{ github.sha }}"
      - name: Smoke tests
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$DEV_API_URL/health" && exit 0 || sleep 6
          done
          echo "Smoke test failed" && exit 1
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}

  deploy-production:
    name: Production deployment (manual approval)
    if: vars.AZURE_PROD_CLIENT_ID != ''
    needs: deploy-dev
    runs-on: ubuntu-latest
    # The 'production' GitHub environment enforces required reviewers —
    # this is the human approval gate; no AI or automation can bypass it.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Compute image ref (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/secureflow-api" >> "$GITHUB_ENV"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
      - name: Verify image signature before rollout
        uses: sigstore/cosign-installer@v4.1.2
      - run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            $IMAGE:${{ github.sha }}
      - name: Canary rollout
        run: |
          az containerapp revision copy \
            --name ca-secureflow-prod-api \
            --resource-group rg-secureflow-prod \
            --image "$IMAGE:${{ github.sha }}"
      - name: Post-deployment verification
        run: |
          sleep 60
          curl -fsS "$PROD_API_URL/health" || (echo "Verification failed — initiating rollback" && \
            az containerapp revision list --name ca-secureflow-prod-api --resource-group rg-secureflow-prod \
              --query "[1].name" -o tsv | xargs -I{} az containerapp revision activate \
              --name ca-secureflow-prod-api --resource-group rg-secureflow-prod --revision {} && exit 1)
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
