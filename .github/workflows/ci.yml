name: secureflow-secure-delivery

on:
  pull_request:
  push:
    branches: [main]

# OIDC federation to Azure — no long-lived client secrets anywhere in this repo.
permissions:
  id-token: write
  contents: read
  security-events: write
  packages: read

env:
  REGISTRY: acrsecureflowdev.azurecr.io
  IMAGE_NAME: secureflow-api

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: API dependencies (uv, locked)
        run: uv sync --locked --all-packages
      - name: API tests (pytest)
        run: uv run --package secureflow-api pytest apps/api/tests
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency scan (npm audit, high+)
        run: pnpm audit --audit-level high

  e2e-http:
    name: HTTP-mode smoke (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: API dependencies (uv, locked)
        run: uv sync --locked --all-packages
      - name: Install Playwright browsers
        run: pnpm --filter @secureflow/web exec playwright install --with-deps chromium
      - name: HTTP-mode smoke suite
        run: pnpm e2e:http

  build:
    name: Build, scan, sign artifacts
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm --filter @secureflow/web build
      - name: Container image build
        run: docker build -f docker/Dockerfile.api -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: SBOM generation (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push image to ACR
        if: github.ref == 'refs/heads/main'
        run: |
          az acr login --name ${REGISTRY%%.*}
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
      - name: Sign image (Cosign, keyless OIDC)
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - if: github.ref == 'refs/heads/main'
        run: cosign sign --yes $REGISTRY/$IMAGE_NAME:${{ github.sha }}
      - name: Attach SBOM attestation
        if: github.ref == 'refs/heads/main'
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  infrastructure:
    name: Terraform validate & plan
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format validation
        run: terraform fmt -recursive -check
        working-directory: infrastructure
      - name: Azure login (OIDC)
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init (no backend on PRs)
        run: terraform init -backend=false -input=false
        if: github.event_name == 'pull_request'
      - name: Terraform init
        run: terraform init -input=false
        if: github.event_name == 'push'
      - name: Terraform validate
        run: terraform validate
      - name: IaC policy scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          framework: terraform
          hard_fail_on: HIGH
      - name: Terraform plan
        if: github.event_name == 'push'
        run: terraform plan -input=false -out=tfplan
      - name: Upload plan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan

  deploy-dev:
    name: Deploy to development
    if: github.ref == 'refs/heads/main'
    needs: [build, infrastructure]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App image
        run: |
          az containerapp update \
            --name ca-secureflow-dev-api \
            --resource-group rg-secureflow-dev \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}
      - name: Smoke tests
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$DEV_API_URL/health" && exit 0 || sleep 6
          done
          echo "Smoke test failed" && exit 1
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}

  deploy-production:
    name: Production deployment (manual approval)
    needs: deploy-dev
    runs-on: ubuntu-latest
    # The 'production' GitHub environment enforces required reviewers —
    # this is the human approval gate; no AI or automation can bypass it.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
      - name: Verify image signature before rollout
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }}
      - name: Canary rollout
        run: |
          az containerapp revision copy \
            --name ca-secureflow-prod-api \
            --resource-group rg-secureflow-prod \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}
      - name: Post-deployment verification
        run: |
          sleep 60
          curl -fsS "$PROD_API_URL/health" || (echo "Verification failed — initiating rollback" && \
            az containerapp revision list --name ca-secureflow-prod-api --resource-group rg-secureflow-prod \
              --query "[1].name" -o tsv | xargs -I{} az containerapp revision activate \
              --name ca-secureflow-prod-api --resource-group rg-secureflow-prod --revision {} && exit 1)
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
