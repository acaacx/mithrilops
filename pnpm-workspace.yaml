packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# brace-expansion DoS bypassing the CVE-2026-14257 mitigation: patched in
# 1.1.18 (1.x line, via eslint > minimatch@3) and 5.0.9 (5.x line). Both are
# same-major bumps, so force them rather than except them.
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  # js-yaml prototype-pollution in the 4.x resolver (GHSA-5p4m-2wfm-xmqj,
  # CVE-2026-59870): patched in 4.3.1. Same-major bump, so force it.
  # Dev-only reach today (eslint > @eslint/eslintrc), but the override keeps
  # any future direct use patched too.
  js-yaml@4: ^4.3.1
  # nanoid GHSA-2v37-7h3g-55p8 (advisory widened: custom generators can loop
  # indefinitely when size is zero): patched in 3.3.18. Same-major bump, so
  # force it. Reached via vite > postcss, build-time only.
  nanoid@3: ^3.3.18

auditConfig:
  # GHSA-mh99-v99m-4gvg (brace-expansion DoS). The advisory range `<=5.0.7`
  # semver-matches the 1.x line, so pnpm flags brace-expansion@1.1.16 even
  # though 1.x was fixed in 1.1.12. Only reachable via
  # eslint > minimatch@3 > brace-expansion, a devDependency that never ships.
  # Revisit when eslint's minimatch chain moves off brace-expansion 1.x.
  #
  # GHSA-qwww-vcr4-c8h2 (React Router RSC mode CSRF bypass). The vulnerable
  # code path is the RSC server action handler; this app is a declarative
  # BrowserRouter SPA with no RSC, no server rendering, and no router actions,
  # so the path does not exist in the bundle. The advisory range is
  # `>=7.12.0 <8.3.0` and react-router 8 requires React 19.2.7+ and Vite 7+,
  # which this app is not on. Revisit with the React 19 / Vite 7 upgrade.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-qwww-vcr4-c8h2
