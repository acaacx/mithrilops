<svg viewBox="0 0 1900 1000" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f7f0"/>
      <stop offset="1" stop-color="#dcedfb"/>
    </linearGradient>
    <linearGradient id="gApi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3e3"/>
      <stop offset="1" stop-color="#fbe7d0"/>
    </linearGradient>
    <linearGradient id="gPkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efeafa"/>
      <stop offset="1" stop-color="#e3e9f8"/>
    </linearGradient>
    <linearGradient id="gAz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2fc"/>
      <stop offset="1" stop-color="#d9e9fb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1000" fill="#f8fafc"/>

  <!-- header -->
  <text x="40" y="58" font-size="34" font-weight="700" fill="#0f172a">SecureFlow Control Center — Architecture</text>
  <text x="40" y="92" font-size="17" fill="#475569">React SPA · FastAPI backend · shared TypeScript packages · Azure (Terraform)</text>

  <!-- ===== packages panel ===== -->
  <rect x="40" y="240" width="330" height="520" rx="16" fill="url(#gPkg)" stroke="#7c6bd6" stroke-width="2"/>
  <text x="65" y="282" font-size="24" font-weight="700" fill="#3b2f86">packages</text>
  <text x="65" y="304" font-size="14" fill="#5b559b">shared TypeScript (monorepo)</text>

  <rect x="65" y="330" width="280" height="130" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="205" y="362" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">types</text>
  <text x="205" y="388" font-size="14" fill="#64748b" text-anchor="middle">domain model · enums</text>
  <text x="205" y="408" font-size="14" fill="#64748b" text-anchor="middle">zod schemas · provider contracts</text>

  <rect x="65" y="510" width="280" height="120" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="205" y="542" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">mock-data</text>
  <text x="205" y="568" font-size="14" fill="#64748b" text-anchor="middle">deterministic seeds</text>
  <text x="205" y="588" font-size="14" fill="#64748b" text-anchor="middle">MOCK_NOW-pinned clock</text>

  <line x1="205" y1="510" x2="205" y2="466" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== web panel ===== -->
  <rect x="450" y="100" width="780" height="400" rx="16" fill="url(#gWeb)" stroke="#2b9e83" stroke-width="2"/>
  <text x="475" y="142" font-size="24" font-weight="700" fill="#065f46">apps/web</text>
  <text x="600" y="142" font-size="16" fill="#3f6212">— React SPA (Vite · Tailwind v4)</text>

  <rect x="480" y="170" width="230" height="80" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="595" y="202" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">pages / components</text>
  <text x="595" y="226" font-size="14" fill="#64748b" text-anchor="middle">routes · views · UI</text>

  <rect x="480" y="300" width="230" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="595" y="332" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">lib/queries</text>
  <text x="595" y="358" font-size="14" fill="#64748b" text-anchor="middle">TanStack Query hooks</text>

  <rect x="745" y="170" width="220" height="220" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="855" y="200" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">lib/providers</text>
  <text x="855" y="222" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">factory on VITE_DATA_SOURCE</text>
  <rect x="775" y="242" width="160" height="44" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="855" y="269" font-size="14" font-weight="600" fill="#065f46" text-anchor="middle">http — default</text>
  <rect x="775" y="302" width="160" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="855" y="329" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">mock — memory</text>

  <rect x="1000" y="170" width="205" height="80" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1102" y="202" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">stores</text>
  <text x="1102" y="226" font-size="14" fill="#64748b" text-anchor="middle">zustand: session · notifs</text>

  <rect x="1000" y="280" width="205" height="80" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1102" y="312" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">lib/ai</text>
  <text x="1102" y="336" font-size="14" fill="#64748b" text-anchor="middle">simulated AIService</text>

  <rect x="1000" y="390" width="205" height="80" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1102" y="420" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">lib/realtime</text>
  <text x="1102" y="444" font-size="14" fill="#64748b" text-anchor="middle">sse-client · simulator</text>

  <line x1="595" y1="250" x2="595" y2="296" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="345" x2="741" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1000,435 C900,482 762,468 716,394" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDot)"/>
  <text x="845" y="480" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="5" paint-order="stroke" text-anchor="middle">invalidates query keys</text>

  <!-- ===== api panel ===== -->
  <rect x="450" y="560" width="780" height="360" rx="16" fill="url(#gApi)" stroke="#d97a2b" stroke-width="2"/>
  <text x="475" y="602" font-size="24" font-weight="700" fill="#7c2d12">apps/api</text>
  <text x="600" y="602" font-size="16" fill="#9a3412">— FastAPI (uv-managed Python workspace)</text>

  <rect x="480" y="630" width="230" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="595" y="662" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">/api/* endpoints</text>
  <text x="595" y="688" font-size="14" fill="#64748b" text-anchor="middle">GET + mutations</text>

  <rect x="745" y="630" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="855" y="662" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">in-memory state store</text>
  <text x="855" y="688" font-size="14" fill="#64748b" text-anchor="middle">seeded from fixtures</text>

  <rect x="1000" y="630" width="205" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1102" y="662" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">simulator</text>
  <text x="1102" y="688" font-size="14" fill="#64748b" text-anchor="middle">tick loop → broadcast</text>

  <rect x="745" y="780" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="855" y="812" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">data/*.json fixtures</text>
  <text x="855" y="838" font-size="14" fill="#64748b" text-anchor="middle">Pydantic-validated</text>

  <rect x="1000" y="780" width="205" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1102" y="812" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">/api/events — SSE</text>
  <text x="1102" y="838" font-size="14" fill="#64748b" text-anchor="middle">run-updated · notification</text>

  <line x1="710" y1="675" x2="741" y2="675" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="855" y1="720" x2="855" y2="776" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="675" x2="969" y2="675" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1102" y1="720" x2="1102" y2="776" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== cross arrows ===== -->
  <!-- providers -> endpoints -->
  <path d="M852,390 V520 H595 V626" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="723" y="512" font-size="14" font-weight="600" fill="#334155" stroke="#f8fafc" stroke-width="6" paint-order="stroke" text-anchor="middle">http (default) — fetch /api/* via Vite proxy</text>

  <!-- sse -> realtime (EventSource) -->
  <path d="M1205,825 C1268,800 1268,462 1210,434" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDot)"/>
  <text x="1254" y="632" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="5" paint-order="stroke" text-anchor="middle" transform="rotate(-90 1254 632)">SSE — EventSource</text>

  <!-- types -> web -->
  <line x1="370" y1="385" x2="446" y2="385" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="372" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="5" paint-order="stroke" text-anchor="middle">shared types</text>

  <!-- mock-data -> fixtures (export:fixtures) -->
  <path d="M345,570 H400 V950 H855 V874" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="942" font-size="14" font-weight="600" fill="#334155" stroke="#f8fafc" stroke-width="6" paint-order="stroke" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">export:fixtures</text>

  <!-- web -> azure swa -->
  <line x1="1230" y1="290" x2="1336" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1282" y="258" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="5" paint-order="stroke" text-anchor="middle">built apps</text>

  <!-- ===== azure panel ===== -->
  <rect x="1310" y="140" width="550" height="700" rx="16" fill="url(#gAz)" stroke="#2f6fb8" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1340" y="182" font-size="24" font-weight="700" fill="#1e3a8a">Azure</text>
  <text x="1425" y="182" font-size="16" fill="#1d4ed8">(Terraform — infrastructure/)</text>

  <rect x="1340" y="220" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1450" y="252" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Static Web App</text>
  <text x="1450" y="278" font-size="14" fill="#64748b" text-anchor="middle">serves built SPA</text>

  <rect x="1340" y="380" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1450" y="412" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Container Apps</text>
  <text x="1450" y="438" font-size="14" fill="#64748b" text-anchor="middle">API · internal ingress</text>

  <rect x="1600" y="220" width="230" height="70" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1715" y="248" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">PostgreSQL</text>
  <text x="1715" y="272" font-size="13" fill="#64748b" text-anchor="middle">Flexible Server · private</text>

  <rect x="1600" y="310" width="230" height="70" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1715" y="338" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Redis</text>
  <text x="1715" y="362" font-size="13" fill="#64748b" text-anchor="middle">TLS-only cache</text>

  <rect x="1600" y="400" width="230" height="70" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1715" y="428" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Key Vault</text>
  <text x="1715" y="452" font-size="13" fill="#64748b" text-anchor="middle">secrets · RBAC</text>

  <rect x="1600" y="490" width="230" height="70" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8"/>
  <text x="1715" y="518" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Container Registry</text>
  <text x="1715" y="542" font-size="13" fill="#64748b" text-anchor="middle">Premium · private</text>

  <line x1="1450" y1="310" x2="1450" y2="376" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1560" y1="410" x2="1596" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1560" y1="420" x2="1596" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1560" y1="432" x2="1596" y2="434" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1560" y1="444" x2="1596" y2="522" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1585" y="800" font-size="14" fill="#1e3a8a" text-anchor="middle">private endpoints · private DNS · managed identities · OIDC-only CI</text>
</svg>
