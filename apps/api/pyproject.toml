[project]
name = "secureflow-api"
version = "0.1.0"
description = "SecureFlow API scaffold — serves the mock dataset over HTTP + SSE (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.scripts]
secureflow-api = "secureflow_api.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secureflow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
